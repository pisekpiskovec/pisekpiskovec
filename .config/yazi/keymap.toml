[mgr]
prepend_keymap = [
  # New keymaps
  { on = "<A-w>", run = "tab_close", desc = "Close the current tab" },
  { on = "<A-,>", run = "tab_switch -1 --relative", desc = "Go to previous tab" },
  { on = "<A-.>", run = "tab_switch 1 --relative", desc = "Go to next tab" },
  { on = "<A-t>", run = "tab_create --current", desc = "Create a new tab with CWD" },
  { on = "<A-T>", run = "tab_create", desc = "Create a new tab" },
  { on = "<C-Space>", run = ["toggle", 'arrow "prev"'], desc = "Toggle the current selection state and go up" },
  { on = [ "g", "d" ], run = "cd ~/Stažené", desc = "Go ~/Stažené" },
  { on = [ "g", "e" ], run = "arrow bot", desc = "Go to bottom" },
  { on = [ "g", "p" ], run = "cd ~/Projekty", desc = "Go ~/Projekty" },

  # Disabling default ones
  { on = "t", run = "noop" },
]
